<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreChat API Generator</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5649c0;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --dark: #2d3436;
            --light: #f5f6fa;
            --success: #00b894;
            --warning: #e17055;
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        @font-face {
            font-family: 'Clash';
            src: url('data:font/woff2;base64,d09GMgABAAAA...') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Clash', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            transform-style: preserve-3d;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, 
                        rgba(108, 92, 231, 0.2) 0%, 
                        transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
            transform: translateZ(40px);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px -5px rgba(108, 92, 231, 0.5);
            animation: float 6s ease-in-out infinite;
        }

        .logo svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #ddd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 100%;
            margin-top: 16px;
            box-shadow: 0 4px 15px rgba(0, 206, 201, 0.3);
            position: relative;
            overflow: hidden;
            transform: translateZ(20px);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:active {
            transform: translateY(2px) translateZ(20px);
            box-shadow: 0 2px 8px rgba(0, 206, 201, 0.3);
        }

        .api-key-container {
            margin-top: 24px;
            display: none;
            animation: fadeIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .api-key-wrapper {
            position: relative;
            margin-bottom: 24px;
            transform: translateZ(30px);
        }

        .api-key {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 60px 18px 20px;
            border-radius: 12px;
            word-break: break-all;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            color: white;
            position: relative;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .api-key:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .copy-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, var(--accent) 0%, #e84393 100%);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(253, 121, 168, 0.3);
        }

        .copy-btn:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .copy-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        .warning {
            background: rgba(225, 112, 85, 0.15);
            border-left: 3px solid var(--warning);
            padding: 16px;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            color: white;
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateZ(20px);
        }

        .features {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            transform: translateZ(10px);
        }

        .feature {
            background: rgba(0, 206, 201, 0.15);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 206, 201, 0.2);
        }

        .success-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 184, 148, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 3D Tilt Effect */
        .card:hover {
            transform: rotateY(5deg) rotateX(5deg);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 24px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="card">
            <div class="card-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M12,20c-4.41,0-8-3.59-8-8s3.59-8,8-8s8,3.59,8,8 S16.41,20,12,20z M12.5,11H11v6h1.5V11z M12.5,8.5H11V10h1.5V8.5z"/>
                    </svg>
                </div>
                <h1>LibreChat API</h1>
                <p class="subtitle">Premium API Key Generator with Gemini 1.5 Flash Integration</p>
            </div>
            
            <button class="btn" id="generateBtn">
                <span>Generate API Key</span>
            </button>
            
            <div class="api-key-container" id="apiKeyContainer">
                <div class="api-key-wrapper">
                    <div class="api-key" id="apiKey"></div>
                    <button class="copy-btn" id="copyBtn" title="Copy to clipboard">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="warning">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span>Do not share this API key. Misuse will result in termination.</span>
                </div>
                
                <div class="features">
                    <div class="feature">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        Secure Connection
                    </div>
                    <div class="feature">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                        Ultra Fast 1.5 Flash
                    </div>
                    <div class="feature">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        Exclusive to LibreChat
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="success-message" id="successMessage">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        API Key Copied!
    </div>

    <script>
        // App functionality
        const generateBtn = document.getElementById('generateBtn');
        const apiKeyContainer = document.getElementById('apiKeyContainer');
        const apiKey = document.getElementById('apiKey');
        const copyBtn = document.getElementById('copyBtn');
        const successMessage = document.getElementById('successMessage');
        const card = document.getElementById('card');
        
        // Generate API key
        generateBtn.addEventListener('click', function() {
            apiKey.textContent = 'AIzaSyDx0_GdUPd5KEpnwC-FunxkuwYdr30OWaQ';
            apiKeyContainer.style.display = 'block';
            generateBtn.innerHTML = '<span>Regenerate API Key</span>';
            
            // Animate card
            card.style.transform = 'rotateY(10deg) rotateX(5deg)';
            setTimeout(() => {
                card.style.transform = 'rotateY(0) rotateX(0)';
            }, 500);
        });
        
        // Copy to clipboard
        copyBtn.addEventListener('click', function() {
            navigator.clipboard.writeText(apiKey.textContent)
                .then(() => {
                    showSuccessMessage();
                    
                    // Animate copy button
                    copyBtn.style.transform = 'translateY(-50%) scale(0.9)';
                    setTimeout(() => {
                        copyBtn.style.transform = 'translateY(-50%) scale(1.1)';
                        setTimeout(() => {
                            copyBtn.style.transform = 'translateY(-50%) scale(1)';
                        }, 100);
                    }, 100);
                })
                .catch(err => {
                    console.error('Failed to copy:', err);
                });
        });
        
        // Show success message
        function showSuccessMessage() {
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // 3D tilt effect
        card.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 15;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 15;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
        
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0) rotateX(0)';
        });
        
        // Make the app installable
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            setTimeout(() => {
                if (confirm("Install LibreChat API Generator as an app?")) {
                    e.prompt();
                }
            }, 15000);
        });
        
        // Service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:application/javascript;base64,' + btoa(`
                const CACHE_NAME = 'librechat-api-v2';
                const ASSETS = [
                    '/',
                    '/index.html',
                    '/styles.css',
                    '/script.js'
                ];
                
                self.addEventListener('install', (e) => {
                    e.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(cache => cache.addAll(ASSETS))
                    );
                });
                
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        fetch(e.request)
                            .then(response => {
                                const responseClone = response.clone();
                                caches.open(CACHE_NAME)
                                    .then(cache => cache.put(e.request, responseClone));
                                return response;
                            })
                            .catch(() => caches.match(e.request))
                    );
                });
            `));
        }
    </script>
</body>
</html>
